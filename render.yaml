services:
  # --- BACKEND: CRON qui lance main_new.py ---
  - type: cron
    name: jobscout-backend-cron
    env: python
    plan: free
    schedule: "* 7 * * *"   # jeden Tag um 07:00 (bin mir nicht sicher welcher Uhrzeit. Server in Frankfurt also maybe Berlin?)
    buildCommand: pip install -r requirements_render.txt
    startCommand: python main_new.py
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: jobscout-slackbot
    env: python
    buildCommand: pip install -r requirements_render.txt
    startCommand: uvicorn slackbot_app:asgi_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
