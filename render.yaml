services:
  - type: web
    name: jobscout-slackbot
    env: python
    plan: free
    buildCommand: pip install -r requirements_render.txt
    startCommand: uvicorn slackbot_app:asgi_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false


  - type: web
    name: jobscout-slackbot
    env: python
    buildCommand: pip install -r requirements_render.txt
    startCommand: uvicorn slackbot_app:asgi_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
